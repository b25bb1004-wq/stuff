[package]
name = "neon"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[features]
default = ["std"]
std = ["dep:aci"]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "titan"
path = "src/bin/titan.rs"
required-features = ["std"]

[dependencies]
aci = { path = "../aci", optional = true }
chisel = { path = "../chisel" }
cobalt = { path = "../cobalt" }
hades = { path = "../hades" }
logos = { path = "../logos" }
silicon = { path = "../silicon" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
indium = { path = "../indium" }

[dev-dependencies]
assay = { path = "../assay" }

[lints]
workspace = true
