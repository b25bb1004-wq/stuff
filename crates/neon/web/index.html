<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Monolith — Titan &amp; Logos</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Monolith Browser Workbench</h1>
    <span id="wasm-status" class="badge">loading wasm…</span>
  </header>

  <main class="grid">
    <section class="pane" aria-label="Titan Shell">
      <div class="pane-head">
        <h2>Titan RISC-V Shell</h2>
        <span id="titan-status" class="status">booting…</span>
      </div>
      <pre id="term-out" class="console" aria-live="polite"></pre>
      <form id="term-form" class="term-input">
        <span class="prompt" aria-hidden="true">$</span>
        <input
          id="term-in"
          type="text"
          autocomplete="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="waiting for shell…"
          disabled
        >
        <button id="term-send" type="submit" disabled>Send</button>
      </form>
    </section>

    <section class="pane" aria-label="Logos Playground">
      <div class="pane-head">
        <h2>Logos Playground</h2>
        <div class="controls">
          <label for="logos-examples" class="sr-only">Examples</label>
          <select id="logos-examples">
            <option value="hello">Hello</option>
            <option value="loop">Loop + Arithmetic</option>
            <option value="error">Type Error</option>
          </select>
          <button id="logos-run" type="button" disabled>Run</button>
        </div>
      </div>
      <textarea id="logos-src" rows="11" spellcheck="false" aria-label="Logos source"></textarea>
      <pre id="logos-out" class="output" aria-live="polite"></pre>
    </section>
  </main>

  <script src="neon.js" defer></script>
</body>
</html>
