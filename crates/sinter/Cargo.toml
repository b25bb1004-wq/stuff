[package]
name = "sinter"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "mica"
path = "src/main.rs"

[features]
default = ["quartz"]
quartz = ["dep:quartz"]

[dependencies]
chisel = { path = "../chisel" }
geode = { path = "../geode" }
mica = { path = "../mica" }
quartz = { path = "../quartz", optional = true }

[dev-dependencies]
assay = { path = "../assay" }

[lints]
workspace = true
