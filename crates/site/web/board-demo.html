<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Board demo</title>
<link rel="stylesheet" href="_kit/tokens.css">
<link rel="stylesheet" href="_kit/motion.css">
<style>
  :root {
    --mask: #0B3D2E;
    --mask-deep: #072A20;
    --copper: #C8803C;
    --signal: #FFC46B;
    --silk: #EEF0E6;
    --silk-dim: #9DB5A8;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --mask: #D8CFA4;
      --mask-deep: #C4B98A;
      --copper: #9A5B22;
      --signal: #D9480F;
      --silk: #1F2A1F;
      --silk-dim: #4B5A45;
    }
  }
  :root[data-theme="light"] {
    --mask: #D8CFA4;
    --mask-deep: #C4B98A;
    --copper: #9A5B22;
    --signal: #D9480F;
    --silk: #1F2A1F;
    --silk-dim: #4B5A45;
  }
  html, body { margin: 0; height: 100%; background: var(--mask); color: var(--silk); }
  body { font-family: Bahnschrift, "DIN Alternate", "Arial Narrow", sans-serif; overflow: hidden; }
  .board { position: fixed; inset: 0; }
  #board { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="board"><canvas id="board"></canvas></div>
<script src="_kit/motion-table.js"></script>
<script src="_kit/motion.js"></script>
<script src="systems.js"></script>
<script src="board.js"></script>
<script>
(function () {
  "use strict";
  var SYSTEMS = window.MONOLITH_SYSTEMS;
  var canvas = document.getElementById("board");
  var PERIOD = 300;
  var board = window.Board.mount(canvas, SYSTEMS);

  // Real dependencies from board.js: child to parent, one pair per copper trace.
  var PAIRS = [];
  Object.keys(window.Board.DEPS).forEach(function (child) {
    window.Board.DEPS[child].forEach(function (parent) { PAIRS.push([child, parent]); });
  });

  function tick() {
    var d = PAIRS[Math.floor(Math.random() * PAIRS.length)];
    var flip = Math.random() < 0.5;
    board.pulse(flip ? d[1] : d[0], flip ? d[0] : d[1], "data");
    if (Motion.reduced()) setTimeout(tick, PERIOD);
    else Motion.tween(PERIOD, "out", function () {}).done.then(tick);
  }
  tick();

  window.selftest = function () {
    var results = [];
    function check(name, ok) { results.push({ name: name, ok: !!ok }); }
    var lay = board.layout();
    var overlap = false;
    for (var i = 0; i < lay.length; i++) {
      for (var j = i + 1; j < lay.length; j++) {
        var a = lay[i], b = lay[j];
        if (a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h) overlap = true;
      }
    }
    check("25 chips laid out without overlap", lay.length === 25 && !overlap);

    var traced = PAIRS.every(function (p) { return board.hasTrace(p[0], p[1]); });
    check("every dep has a trace", traced && board.stats().traces === PAIRS.length);

    var cw = canvas.clientWidth, ch = canvas.clientHeight;
    check("chipRect inside canvas", SYSTEMS.every(function (s) {
      var r = board.chipRect(s.id);
      return r && r.x >= 0 && r.y >= 0 && r.x + r.w <= cw && r.y + r.h <= ch;
    }));

    check("no trace point more than one chip-width outside its pads", board.stats().traceStray === 0);

    var tr = board.chipRect("titan"), lr = board.chipRect("lithium");
    check("titan chip area at least 3x a normal chip", tr && lr && tr.w * tr.h >= 3 * lr.w * lr.h);

    var before = board.stats();
    document.documentElement.dataset.motion = "reduce";
    var p0 = PAIRS[0];
    board.pulse(p0[0], p0[1], "data");
    var during = board.stats();
    delete document.documentElement.dataset.motion;
    check("reduced motion uses blink, no travelling pulse", during.live === before.live && during.blinking >= 1);

    for (var k = 0; k < 30; k++) {
      var q = PAIRS[k % PAIRS.length];
      board.pulse(q[0], q[1], "data");
    }
    check("24-pulse cap holds", board.stats().live === 24);

    var pass = results.filter(function (r) { return r.ok; }).length;
    var total = results.length;
    document.title = (pass === total ? "SELFTEST PASS " : "SELFTEST FAIL ") + pass + "/" + total;
    return { pass: pass, total: total, results: results };
  };
  window.selftest();
})();
</script>
</body>
</html>
