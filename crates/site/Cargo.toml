[package]
name = "site"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
neon = { path = "../neon" }
iridium = { path = "../iridium" }
hades = { path = "../hades" }
chisel = { path = "../chisel" }
silicon = { path = "../silicon" }
lithium = { path = "../lithium" }
sphinx = { path = "../sphinx" }
cobalt = { path = "../cobalt" }
elysium = { path = "../elysium" }
logos = { path = "../logos" }
mercury = { path = "../mercury", default-features = false }
aurum = { path = "../aurum" }
argo = { path = "../argo" }
krypton = { path = "../krypton", default-features = false }
calliope = { path = "../calliope" }
chronos = { path = "../chronos", default-features = false }
kairos = { path = "../kairos", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
athena = { path = "../athena" }
pigment = { path = "../pigment" }

[dev-dependencies]
assay = { path = "../assay" }

[lints]
workspace = true
