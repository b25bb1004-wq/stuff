<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SELFTEST</title>
<link rel="stylesheet" href="/_kit/tokens.css">
<link rel="stylesheet" href="/_kit/motion.css">
<link rel="stylesheet" href="style.css">
<script src="/_kit/motion.js"></script>
<style>
  body { padding: var(--sp-4); }
  pre { white-space: pre-wrap; font-family: var(--font-code); font-size: var(--fs-code); }
</style>
</head>
<body>
<h1>Athena motion self-test</h1>
<pre id="out"></pre>
<div id="host" style="position: relative; height: 40px;">
  <div class="run-hair" hidden></div>
  <div class="run-ticks" hidden></div>
</div>
<div id="box"></div>
<script type="module">
import { showEl, afterPaint, createRunLine, tokenMs } from "./athena-motion.js";
import { tokenFromSearch, createFsApi, createFsTree, parentOf, isWithin, remapPath } from "./fs-api.js";

// A fake API object with the shape createFsApi returns: a folder held in memory, no server.
function fakeFolder(seed) {
  const files = new Map(Object.entries(seed));
  const dirs = new Set();
  const calls = [];
  const under = (p, dir) => p.startsWith(dir + "/");
  const exists = (p) => files.has(p) || dirs.has(p) || [...files.keys()].some((k) => under(k, p));
  return {
    calls,
    paths: () => [...files.keys()].sort(),
    dirs: () => [...dirs].sort(),
    async list(dir) {
      calls.push(["list", dir]);
      const kids = new Map();
      const add = (p) => {
        if (dir && !under(p, dir)) return;
        const rest = dir ? p.slice(dir.length + 1) : p;
        const [first] = rest.split("/");
        kids.set(first, rest.includes("/") || dirs.has(dir ? `${dir}/${first}` : first) ? "dir" : "file");
      };
      [...files.keys(), ...dirs].forEach(add);
      return [...kids].map(([name, kind]) => ({ name, kind, size: 0 }));
    },
    async read(p) {
      calls.push(["read", p]);
      if (!files.has(p)) throw new Error("not found");
      return files.get(p);
    },
    async write(p, text) {
      calls.push(["write", p]);
      files.set(p, text);
    },
    async create(p, kind) {
      calls.push(["create", p, kind]);
      if (exists(p)) throw new Error("already exists");
      if (kind === "dir") dirs.add(p);
      else files.set(p, "");
    },
    async rename(from, to) {
      calls.push(["rename", from, to]);
      if (!exists(from)) throw new Error("not found");
      if (exists(to)) throw new Error("target exists");
      for (const k of [...files.keys()]) if (k === from || under(k, from)) { files.set(remapPath(k, from, to), files.get(k)); files.delete(k); }
      for (const d of [...dirs]) if (d === from || under(d, from)) { dirs.delete(d); dirs.add(remapPath(d, from, to)); }
    },
    async trash(p) {
      calls.push(["trash", p]);
      for (const k of [...files.keys()]) if (k === p || under(k, p)) files.delete(k);
      for (const d of [...dirs]) if (d === p || under(d, p)) dirs.delete(d);
    },
  };
}

// Checks for the folder mode: URL token, HTTP client shape, the explorer model, and path helpers.
async function fsChecks() {
  check("fs-token-valid", tokenFromSearch("?t=" + "ab".repeat(32)) === "ab".repeat(32), "valid token refused");
  check("fs-token-absent", tokenFromSearch("") === null && tokenFromSearch("?t=../x") === null && tokenFromSearch("?t=AB") === null,
    "a missing or odd token opened folder mode");

  // The HTTP client: the path is encoded, the token header is sent, and failures carry the server message.
  // Replies are served in order: list, a refused read, a read, and a write.
  const seen = [];
  const replies = [
    new Response(JSON.stringify([{ name: "a b.logos", kind: "file", size: 3 }]), { status: 200 }),
    new Response(JSON.stringify({ error: "missing or wrong token" }), { status: 401 }),
    new Response("text body", { status: 200 }),
    new Response('{"ok":true}', { status: 200 }),
  ];
  const http = createFsApi({ token: "ab".repeat(32), fetchFn: async (url, init) => { seen.push({ url, init }); return replies.shift(); } });
  const listed = await http.list("notes/a b");
  check("fs-client-list", listed[0].name === "a b.logos" && seen[0].url === "/api/fs/list?path=notes%2Fa%20b" &&
    seen[0].init.method === "GET" && seen[0].init.headers["X-Athena-Token"] === "ab".repeat(32), seen[0].url);
  let refusedWith = "";
  try { await http.read("x.logos"); } catch (err) { refusedWith = err.message; }
  check("fs-client-error", refusedWith === "missing or wrong token", "message " + refusedWith);
  check("fs-client-read", (await http.read("y.logos")) === "text body", "read text not returned");
  const written = await http.write("y.logos", "t");
  check("fs-client-write", written.ok === true && seen[3].init.method === "PUT" && seen[3].init.body === "t",
    "method " + seen[3].init.method);

  // Path helpers: a rename or trash reaches every path under the folder, and nothing else.
  check("fs-paths", parentOf("a/b/c.logos") === "a/b" && parentOf("top.logos") === "" &&
    isWithin("a/b/c", "a/b") && !isWithin("a/bc", "a/b") && remapPath("a/b/c", "a/b", "x") === "x/c" &&
    remapPath("a/bc", "a/b", "x") === "a/bc", "path helpers disagree");

  // The explorer model over the fake folder: folders start closed, open on toggle, and reload after a change.
  const folder = fakeFolder({ "main.logos": "fn main() {}", "notes/todo.md": "- a", "notes/deep/x.txt": "x" });
  let changes = 0;
  const tree = createFsTree(folder, () => { changes += 1; });
  await tree.load("");
  const top = tree.rows().map((r) => r.path);
  check("tree-root", top.join(",") === "notes,main.logos" && tree.rows()[0].dir === true, "rows " + top.join(","));
  await tree.toggle("notes");
  const opened = tree.rows().map((r) => `${r.depth}:${r.path}`);
  check("tree-toggle", opened.includes("1:notes/todo.md") && opened.includes("1:notes/deep") && changes >= 2,
    "rows " + opened.join(","));
  await tree.reveal("notes/deep");
  check("tree-reveal", tree.rows().some((r) => r.path === "notes/deep/x.txt"), "reveal did not open the folder");
  check("tree-no-error", tree.error() === "", "error " + tree.error());

  // A listing failure is reported, not thrown, and the explorer keeps its last rows.
  const broken = createFsTree({ list: async () => { throw new Error("HTTP 403"); } });
  check("tree-error", (await broken.load("")) === "HTTP 403" && broken.error() === "HTTP 403", "error not kept");

  // Create, rename and trash through the fake API keep the listing in step.
  await folder.create("draft.logos", "file");
  await folder.rename("notes", "journal");
  tree.forget("notes");
  await tree.load("");
  check("tree-rename", folder.paths().includes("journal/todo.md") && !folder.paths().includes("notes/todo.md") &&
    tree.rows().some((r) => r.path === "journal"), "rename not reflected");
  await folder.trash("journal/deep");
  check("trash-subtree", !folder.paths().includes("journal/deep/x.txt") && folder.paths().includes("journal/todo.md"),
    "trash removed the wrong paths");
  check("fake-folder-calls", folder.calls.some((c) => c[0] === "rename" && c[1] === "notes" && c[2] === "journal"),
    "rename call missing");
}

const out = document.getElementById("out");
const root = document.documentElement;
let pass = 0;
let total = 0;

function check(name, ok, why) {
  total += 1;
  if (ok) pass += 1;
  out.textContent += (ok ? "PASS " : "FAIL ") + name + (ok ? "" : " " + (why || "")) + "\n";
}
const wait = (ms) => new Promise((r) => setTimeout(r, ms));
const onlyOpacityTransform = (el) => el.getAnimations().every((a) =>
  a.effect.getKeyframes().every((k) => Object.keys(k).every((key) =>
    ["opacity", "transform", "offset", "easing", "composite", "computedOffset"].includes(key))));

async function run() {
  // The kit API Athena builds on is present.
  check("kit-api", ["enter", "exit", "flip", "tween"].every((n) => typeof Motion[n] === "function"),
    "a Motion function is missing");

  // The firm spring from motion.css: its settle time is the token value.
  check("firm-token", tokenMs("--spring-firm-t") === 270, "--spring-firm-t is " + tokenMs("--spring-firm-t"));

  // Panels, tabs and the palette fade in on firm, and only opacity and transform move.
  const box = document.getElementById("box");
  Motion.enter(box, { curve: "firm", dist: 1 });
  const anims = box.getAnimations();
  check("firm-enter", anims.length === 1 && anims[0].effect.getTiming().duration === 270 && onlyOpacityTransform(box),
    "animations " + anims.length);
  anims.forEach((a) => a.cancel());

  // showEl shows a hidden element and hides another at once.
  const tab = document.createElement("div");
  tab.hidden = true;
  box.appendChild(tab);
  showEl(tab, true);
  check("showel-show", tab.hidden === false && tab.getAnimations().length === 1, "shown without a firm enter");
  showEl(tab, false);
  check("showel-hide", tab.hidden === true, "not hidden");
  tab.remove();

  // Reduced motion shows end states at once: no animation starts.
  root.dataset.motion = "reduce";
  const quiet = document.createElement("div");
  quiet.hidden = true;
  box.appendChild(quiet);
  showEl(quiet, true);
  check("reduced-showel", quiet.hidden === false && quiet.getAnimations().length === 0, "an animation started");
  quiet.remove();
  delete root.dataset.motion;

  // The Run line: the sweep and the ticks land on the fixture, and the tick colour follows the result.
  const host = document.getElementById("host");
  const hair = host.querySelector(".run-hair");
  const ticks = host.querySelector(".run-ticks");
  const line = createRunLine(host);
  line.start();
  check("run-start", hair.hidden === false && ticks.hidden === false && hair.style.transform === "scaleX(0)",
    "hair " + hair.style.transform);
  line.land("error: unexpected token");
  check("run-error-tick", ticks.children.length === 1 && ticks.children[0].className === "run-tick is-bad",
    "ticks " + ticks.children.length);
  await wait(tokenMs("--t-large") + tokenMs("--spring-firm-t") + 100);
  check("run-sweep-end", hair.style.transform === "scaleX(1)" && hair.hidden === true,
    "transform " + hair.style.transform + " hidden " + hair.hidden);

  line.start();
  line.land("42\n");
  check("run-ok-ticks", ticks.children.length === 2 && ticks.children[0].className === "run-tick" &&
    ticks.children[1].className === "run-tick", "ticks " + ticks.children.length);
  line.start();
  check("run-restart-clears", ticks.children.length === 0 && hair.hidden === false, "ticks kept");
  await wait(tokenMs("--t-large") + tokenMs("--spring-firm-t") + 100);

  // Reduced motion: the sweep ends in the same call, and a normal run after it is visible again.
  root.dataset.motion = "reduce";
  line.start();
  check("reduced-run", hair.style.transform === "scaleX(1)", "transform " + hair.style.transform);
  await wait(50);
  delete root.dataset.motion;
  line.start();
  await wait(tokenMs("--t-large") + tokenMs("--spring-firm-t") + 100);
  check("run-after-reduced", hair.style.opacity === "" && hair.style.transform === "scaleX(1)",
    "opacity " + hair.style.opacity);

  // afterPaint runs its callback once the kit frame loop has ticked.
  let painted = false;
  afterPaint(() => { painted = true; });
  await wait(tokenMs("--t-press") + 100);
  check("after-paint", painted, "callback did not run");

  // The page wiring: the kit files and the Run line and debugger hooks are in the shipped markup.
  try {
    const html = await (await fetch("index.html")).text();
    check("index-kit-links", html.includes("/_kit/motion.css") && html.includes("/_kit/motion.js"),
      "index.html does not load the motion kit");
    check("index-run-line", html.includes('id="run-hair"') && html.includes('id="run-ticks"'),
      "run line markup missing");
    const css = await (await fetch("style.css")).text();
    check("style-run-tick", css.includes(".run-tick") && css.includes(".run-hair"), "run line styles missing");
  } catch (e) {
    check("index-fetch", false, String(e));
  }

  try {
    await fsChecks();
  } catch (e) {
    check("fs-checks-run", false, String(e));
  }

  document.title = "SELFTEST " + (pass === total ? "PASS " : "FAIL ") + pass + "/" + total;
  out.textContent += "DONE " + pass + "/" + total + "\n";
}

run();
</script>
</body>
</html>
