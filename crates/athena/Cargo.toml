[package]
name = "athena"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "athena"
path = "src/bin/athena.rs"

[dependencies]
calliope = { path = "../calliope" }
cobalt = { path = "../cobalt" }
elysium = { path = "../elysium" }
logos = { path = "../logos" }
neon = { path = "../neon" }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pigment = { path = "../pigment" }

[dev-dependencies]
assay = { path = "../assay" }

[lints]
workspace = true
