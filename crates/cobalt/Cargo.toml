[package]
name = "cobalt"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "logos"
path = "src/main.rs"
required-features = ["std"]

[[bin]]
name = "cobalt"
path = "src/bin/cobalt.rs"
required-features = ["std"]

[features]
default = ["silicon", "std"]
silicon = ["dep:silicon"]
std = ["dep:aci"]

[dependencies]
aci = { path = "../aci", optional = true }
chisel = { path = "../chisel" }
elysium = { path = "../elysium" }
logos = { path = "../logos" }
silicon = { path = "../silicon", optional = true }

[dev-dependencies]
assay = { path = "../assay" }

[lints]
workspace = true
