[package]
name = "cobalt"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[[bin]]
name = "logos"
path = "src/main.rs"

[[bin]]
name = "cobalt"
path = "src/bin/cobalt.rs"

[features]
default = ["silicon"]
silicon = ["dep:silicon"]

[dependencies]
chisel = { path = "../chisel" }
elysium = { path = "../elysium" }
logos = { path = "../logos" }
silicon = { path = "../silicon", optional = true }

[dev-dependencies]
assay = { path = "../assay" }

[lints]
workspace = true
