# T82: runs the Strata gate (tools/check.sh: fmt, clippy -D warnings, all tests, zero-dependency rule).
# Linux (the crust tests compare against Linux bash, which the dev PC runs through WSL) and Rust
# 1.98.0 like the local gate (newer clippy adds lints). Some leader tests shell out to python (+ Pillow), git, bash.
name: gate
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      - run: python -m pip install --disable-pip-version-check pillow==12.3.0 tinycss2==1.5.1 soupsieve==2.9.2 beautifulsoup4==4.15.0
      - run: rustup toolchain install 1.98.0 --profile minimal -c rustfmt,clippy && rustup default 1.98.0
        shell: bash
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
        shell: bash
      - name: gate
        run: bash tools/check.sh
        shell: bash
