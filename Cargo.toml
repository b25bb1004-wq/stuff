[workspace]
resolver = "2"
members = [
    "crates/assay",
    "crates/onyx",
    "crates/quarry",
    "crates/geyser",
    "crates/shale",
    "crates/quartz",
    "crates/chisel",
    "crates/geode",
    "crates/mica",
    "crates/sinter",
    "crates/tremor",
    "crates/outcrop",
    "crates/varve",
    "crates/drillcore",
    "crates/cairn",
    "crates/seam",
    "crates/crust",
    "crates/slate",
    "crates/pigment",
    "crates/glint",
    "crates/facet",
    "crates/spelunk",
    "crates/tectonic",
    "crates/vug",
]

[workspace.lints.rust]
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"
